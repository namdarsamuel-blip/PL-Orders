<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket P&amp;L Tracker</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;--surface:#ffffff;--surface-2:#f1f3f6;--line:#e5e7ec;--text:#111827;--text-2:#4b5563;--muted:#8a909c;
  --accent:#2a78d6;--accent-ink:#fff;--navy:#121a33;--pos:#0b8a3a;--neg:#d23b3b;--bar-up:#2a78d6;--bar-down:#e34948;
  --warn-bg:#fff6dc;--warn:#7a5300;--ok-bg:#e6f4ea;--shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);--r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--surface:#171a20;--surface-2:#1f232b;--line:#2a2f39;--text:#eef0f4;--text-2:#b6bcc8;--muted:#858c99;
  --accent:#4b93ea;--navy:#e8ecf5;--pos:#46c46e;--neg:#ff7a7a;--bar-up:#3987e5;--bar-down:#e66767;--warn-bg:#352b12;--warn:#f5cf73;--ok-bg:#183222;--shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0f1115;--surface:#171a20;--surface-2:#1f232b;--line:#2a2f39;--text:#eef0f4;--text-2:#b6bcc8;--muted:#858c99;
  --accent:#4b93ea;--navy:#e8ecf5;--pos:#46c46e;--neg:#ff7a7a;--bar-up:#3987e5;--bar-down:#e66767;--warn-bg:#352b12;--warn:#f5cf73;--ok-bg:#183222;--shadow:none;}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1{font-size:17px;margin:0;font-weight:800;white-space:nowrap}h2{font-size:22px;margin:0;font-weight:800;letter-spacing:-.01em}h3{font-size:15px;margin:0;font-weight:700}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
.hint{color:var(--muted);font-size:13px;margin:8px 0}
.muted{color:var(--muted);font-weight:400}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
.link{background:none;border:0;color:var(--accent);padding:0;text-decoration:underline}
input[type=text],input[type=email],input[type=password],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
/* header */
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;gap:16px;padding:0 20px;max-width:1180px;margin:0 auto;min-height:58px;flex-wrap:wrap}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:18px 12px 16px;color:var(--text-2);white-space:nowrap;font-weight:600}
nav button.on{color:var(--text);border-bottom-color:var(--navy)}
nav .cnt{color:var(--muted);font-weight:500;font-size:12px;margin-left:2px}
#status{color:var(--muted);font-size:12px;white-space:nowrap}
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
/* toolbar + chips */
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .chips{margin:0}
h2 .sub{font-size:14px;font-weight:500;color:var(--muted);margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px}
.chiplabel{color:var(--text-2);font-weight:600;font-size:13px;margin-right:4px;min-width:36px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;color:var(--text)}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.chip-select{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px}
.ghostchip{margin-left:auto}
/* pills */
.pills{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}
.pill2{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;display:flex;align-items:baseline;gap:8px;box-shadow:var(--shadow)}
.pill2 b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}.pill2 span{color:var(--text-2);font-size:13px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
/* cards + lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow);min-width:0}
.cardhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.cardhead .hint{margin:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.bigsearch{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.bigsearch:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
.list{display:flex;flex-direction:column;margin-top:6px}
.row{display:flex;align-items:center;gap:14px;padding:12px 6px;border-top:1px solid var(--line);color:var(--text);text-decoration:none;min-width:0;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;border-radius:0}
.list>.row:first-child,.list>.show:first-child>.row{border-top:0}
a.row:hover,button.row:hover{background:var(--surface-2);text-decoration:none}
.rmain{flex:1;min-width:0}
.rtitle{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.rtitle a{color:var(--text)}.rtitle a.strong{font-weight:800}.rtitle .dot{color:var(--muted)}
.rsub{color:var(--text-2);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.rnum{text-align:right;flex:none;min-width:96px}
.rprofit{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.rdate{flex:none;width:92px;font-size:12.5px;font-weight:600;color:var(--text-2)}.rdate span{font-weight:400;color:var(--muted)}
.chev{flex:none;width:14px;color:var(--muted)}
.show.open>.row{background:var(--surface-2)}
.sublist{margin:0 0 6px 18px;border-left:3px solid var(--line);padding-left:8px}
.sublist .row{padding:9px 6px}
.x{flex:none;background:none;border:0;color:var(--muted);font-size:18px;padding:0 4px;line-height:1}.x:hover{color:var(--neg)}
.more{display:block;width:100%;margin-top:10px;background:var(--surface-2);border:0;border-radius:10px;padding:10px;font-weight:600;color:var(--text-2)}
.foot{border-top:1px solid var(--line);padding-top:10px;margin-top:4px;font-size:13px;color:var(--text-2)}
.empty{color:var(--muted);text-align:center;padding:22px 0;margin:0}
.crumb{margin:0 0 8px;font-weight:600}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:16px}
/* chart */
.chartbox{position:relative}
.chart{width:100%;height:auto;display:block;max-height:240px}
.chart .grid{stroke:var(--line);stroke-width:1}.chart .axis{stroke:var(--muted);stroke-width:1}
.chart .tick{fill:var(--text-2);font-size:11px}
.chart .bar.up{fill:var(--bar-up)}.chart .bar.down{fill:var(--bar-down)}.chart .bar.dim{opacity:.35}
.chart .hit{fill:transparent;cursor:pointer}.chart .hit:hover{fill:var(--text);fill-opacity:.04}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.12);min-width:150px}
/* import */
.drop{display:flex;align-items:center;justify-content:center;border:2px dashed var(--line);border-radius:12px;padding:30px;text-align:center;cursor:pointer;color:var(--text-2)}
.drop.over{border-color:var(--accent);background:var(--surface-2)}.drop input{display:none}
textarea{min-height:150px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.log{margin:0;padding-left:18px}.log li{margin:4px 0}
.card ol{padding-left:20px}.card li{margin:4px 0}
.bm{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:10px;font-weight:600}
/* auth */
.center{max-width:420px;margin:12vh auto;padding:0 16px}.center form{display:grid;gap:10px;margin-top:14px}
.center label{display:grid;gap:4px;color:var(--text-2);font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:var(--navy);color:var(--bg);padding:11px 16px;border-radius:12px;transition:transform .25s;max-width:90vw;z-index:20}
.toast.show{transform:translateX(-50%)}.toast.err{background:var(--neg);color:#fff}
#loading{position:fixed;inset:0;background:rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;z-index:15}
#loading[hidden]{display:none}#loading div{background:var(--surface);padding:14px 20px;border-radius:12px}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}#status{display:none}}
@media (max-width:560px){main{padding:16px 16px 50px}.bar1{padding:0 16px;gap:8px}h1{font-size:15px}
  .row{flex-wrap:wrap;gap:6px 12px}.rdate{width:auto}.rnum{min-width:0}.pill2{padding:7px 12px}.pill2 b{font-size:15px}.ghostchip{margin-left:0}}
</style>
</head>
<body>
<section id="setup" class="center" hidden>
  <h2>🎟️ Ticket P&amp;L Tracker</h2>
  <p class="hint">One-time setup: connect your Supabase project. Find both values in Supabase → Project Settings → API.</p>
  <form id="setupForm">
    <label>Project URL <input id="sbUrl" type="text" required placeholder="https://xxxx.supabase.co"></label>
    <label>anon public key <input id="sbKey" type="text" required placeholder="eyJhbGciOi…"></label>
    <button class="primary">Connect</button>
    <button type="button" class="ghost" id="demoBtn">Try it without saving (demo)</button>
  </form>
</section>

<section id="login" class="center" hidden>
  <h2>🎟️ Ticket P&amp;L Tracker</h2>
  <form id="loginForm">
    <label>Email <input id="email" type="email" required autocomplete="username"></label>
    <label>Password <input id="password" type="password" required autocomplete="current-password"></label>
    <button class="primary" id="loginBtn">Sign in</button>
    <button type="button" class="ghost" id="demoBtn2">Try it without saving (demo)</button>
    <button type="button" class="link" id="resetConn">Change Supabase connection</button>
  </form>
</section>

<div id="app" hidden>
  <header>
    <div class="bar1"><h1>🎟️ Ticket P&amp;L</h1>
      <nav>
        <button data-tab="overview">Overview</button><button data-tab="artists">Artists</button><button data-tab="venues">Venues</button>
        <button data-tab="sales">Sales</button><button data-tab="import">Import</button><button data-tab="extension">Extension</button>
      </nav>
      <span id="status"></span><button class="ghost" id="signOut">Sign out</button></div>
  </header>
  <main id="view"></main>
</div>
<div id="loading" hidden><div>Loading…</div></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
